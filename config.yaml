reddit:
  subreddits:
    - LocalLLaMA
    - MachineLearning
    - singularity
    - artificial
    - OpenAI
    - ClaudeAI
    - LangChain
    - LLMDevs
    # Agent / 工程
    - AI_Agents
    - RAG
    - aipromptprogramming
    - StableDiffusion
    # 专业领域（世界模型 / 知识图谱 / RL）
    - reinforcementlearning
    - KnowledgeGraph
    - compsci
  limit_per_sub: 25
  time_filter: day      # hour | day | week | month
  # 质量门槛：低于该 upvote 的帖子直接丢弃（PRAW + 匿名 JSON 两条路径都生效）
  # 没配 Reddit API 时匿名 JSON 也带 upvote 数，门槛同样有效
  min_upvotes: 30
  # 大 sub 用更高门槛覆盖（避免热门 sub 灌水稀释 niche sub）
  min_upvotes_override:
    LocalLLaMA: 80
    MachineLearning: 80
    singularity: 200
    OpenAI: 100

