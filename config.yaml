# 采集与分析配置。修改后无需重启，每次 run 都会重新读取。
# v2 新增：prefilter / ranker / cluster 模块配置
#
# ─────────────────────────────────────────────────────────────────────
# 📌 如何添加新博主 / 新源（不动代码）
# ─────────────────────────────────────────────────────────────────────
#   1. X/Twitter：在 rss.feeds 加一行
#        - { name: "X/<handle>", url: "http://localhost:1200/twitter/user/<handle>" }
#
#   2. Bluesky：在 rss.feeds 加一行
#        - { name: "BSky/<handle>", url: "https://bsky.app/profile/<handle.bsky.social>/rss" }
#
#   3. YouTube 频道：
#        a) Data API 模式（含评论，消耗 quota）：在 youtube.channels 加一行 channel_id
#        b) Atom feed 模式（无 API 兜底，无评论）：在 rss.feeds 加一行
#             - { name: "YT/<显示名>", url: "https://www.youtube.com/feeds/videos.xml?channel_id=<UC...>" }
#        c) 找 channel_id：
#             curl -L -A "Mozilla/5.0" https://www.youtube.com/@<handle> | grep -oE 'channelId":"UC[A-Za-z0-9_-]{22}'
#
#   4. 微信公众号：在 https://github.com/ttttmr/Wechat2RSS/blob/master/list/all.md 找 feed id
#        - { name: "WX/<名称>", url: "https://wechat2rss.xlab.app/feed/<id>.xml" }
#
#   5. Reddit：在 reddit.subreddits 加一行（如有特殊门槛在 min_upvotes_override 加）
#
#   6. Subreddit / 个人博客 / Newsletter：直接在 rss.feeds 加一行（任何标准 RSS/Atom 都可）
#
#   7. (可选) 给新源加权重：在 ranker.sub_source_boost 里加
#        "X/<handle>": 1.5   # 1.0=正常 / 1.3=高质量 / 1.8=必读 / 0.7=降权
#
#   8. 修改完直接跑 `bash scripts/daily_run.sh`，无需重启服务、无需改代码
# ─────────────────────────────────────────────────────────────────────

