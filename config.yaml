  search_queries:
    - "AI agents 2026"
    - "LLM new research"
    - "agentic workflows"
    - "Claude agent"
  max_results: 8           # 从 15 调到 8，省 ~50% quota，且砍掉长尾低质量视频
  fetch_top_comments: 25
  # velocity 过滤（views/hour），砍掉冷门长尾视频
  # 30 是温和值：新视频 1 小时内 ≥30 views 才算"有人看"；冷门频道也能保留好内容
  min_velocity: 30
  # 累计播放量底线（兜底）：velocity 不达标但 view_count 很高也保留（适合优质旧视频）
  min_views: 3000

