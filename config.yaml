# 旧搜狗模式代码 src/collectors/wechat.py 暂保留但不再被 main.py 加载

twitter:
  enabled: false
  users:
    - sama
    - karpathy
    - GoogleDeepMind
    - AnthropicAI
    - ylecun
  query: "(AI OR LLM OR agent) -is:retweet lang:en"
  max_results: 50

# ─── v2 新增模块 ───

prefilter:
  min_heat: 0             # 热度阈值（0=不过滤，微信公众号无热度数据）
  max_age_hours: 168       # 7天窗口（基于采集时间 fetched_at）

ranker:
  keyword_weights:
    智能体: 3.0
    Agent: 3.0
    agent: 3.0
    大模型: 2.5
    推理: 2.5
    benchmark: 2.5
    "reasoning model": 3.0
    "open source": 2.0
    multimodal: 2.0
    "fine-tuning": 2.0
    RAG: 2.0
    "prompt engineering": 1.5
    safety: 2.0
    "inference optimization": 2.0
    "training trick": 2.5
    evaluation: 2.0
    workflow: 1.5
    voice: 1.5
    memory: 2.0
    "tool use": 2.0
    "Claude Code": 2.5
    "DeepSeek": 2.5
  top_k: 200               # 最多保留 N 条进入 LLM 分析
  top_percent: 0           # 或按百分比保留（0=不启用）
  # 跨源共振加权（同一话题在多个不同来源出现 = 真热点 → 提分）
  resonance_min_sources: 3      # 一个词需要在 ≥N 个不同 sub_source 出现才算"共振词"
  resonance_bonus_per_hit: 1.5  # 命中一个共振词的加分
  resonance_max_bonus: 8.0      # 单 item 共振加分上限（防止刷分）
  source_boost:
    reddit: 1.2
    youtube: 1.1
    wechat: 1.2             # 中文一手资讯，权重与 Reddit 持平
    rss: 1.0
